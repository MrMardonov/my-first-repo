<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free English Level Test | Motive Academy</title>
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <meta name="description" content="Free online English placement test from Motive Academy, Samarkand. 30 questions, about 10 minutes. Find your level and book a free trial lesson.">
  <style>
    :root { --navy: #0B2545; --blue: #2776AB; --cream: #FFF6E8; --gold: #D4A843; --text: #2A3650; --soft: #FFFDF9; --green: #2E8B57; --red: #C0392B; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Nunito', 'Trebuchet MS', Verdana, sans-serif; font-size: 18px; font-weight: 600; color: var(--text); line-height: 1.6; background: var(--cream); min-height: 100vh; display: flex; flex-direction: column; }
    a { color: var(--blue); }

    /* NAV (same as main site) */
    nav { position: sticky; top: 0; z-index: 50; background: rgba(255,253,249,.97); box-shadow: 0 2px 14px rgba(11,37,69,.1);
          display: flex; align-items: center; justify-content: space-between; padding: 8px 24px; gap: 12px; flex-wrap: wrap; }
    nav .logo img { height: 56px; width: auto; }
    .back { text-decoration: none; color: var(--navy); font-weight: 800; }
    .back:hover { color: var(--blue); }
    .lang { display: flex; gap: 6px; }
    .lang button { font-family: inherit; border: 2px solid var(--navy); background: transparent; color: var(--navy); padding: 6px 14px; border-radius: 999px; cursor: pointer; font-weight: 800; font-size: .95rem; }
    .lang button.active { background: var(--navy); color: white; }

    main { flex: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 40px 20px 60px; }
    .panel { background: white; border-radius: 24px; padding: 40px 36px; box-shadow: 0 8px 26px rgba(11,37,69,.09); border-top: 6px solid var(--blue); }
    .hidden { display: none !important; }

    h1 { color: var(--navy); font-size: 2.4rem; font-weight: 900; line-height: 1.2; margin-bottom: 14px; }
    h1::after { content: ""; display: block; width: 70px; height: 6px; background: var(--gold); margin-top: 16px; border-radius: 999px; }
    h2 { color: var(--navy); font-size: 1.6rem; font-weight: 900; line-height: 1.3; }
    .lead { font-size: 1.15rem; margin: 18px 0; }
    .facts { list-style: none; margin: 22px 0 8px; display: grid; gap: 10px; }
    .facts li { background: var(--cream); border-left: 6px solid var(--gold); padding: 10px 16px; border-radius: 12px; font-weight: 800; color: var(--navy); }

    .btn { display: inline-block; margin-top: 28px; background: var(--gold); color: var(--navy); padding: 16px 38px; border-radius: 999px; font-family: inherit;
           text-decoration: none; font-weight: 900; border: none; cursor: pointer; font-size: 1.15rem; box-shadow: 0 6px 18px rgba(212,168,67,.45); transition: transform .15s; }
    .btn:hover { transform: translateY(-2px); }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn.blue { background: var(--blue); color: white; box-shadow: 0 6px 18px rgba(39,118,171,.35); }
    .btn.ghost { background: transparent; color: var(--navy); border: 2px solid var(--navy); box-shadow: none; }

    /* Progress */
    .top { display: flex; justify-content: space-between; align-items: center; font-weight: 800; color: var(--navy); margin-bottom: 10px; }
    .bar { height: 12px; background: #efe6d6; border-radius: 999px; overflow: hidden; margin-bottom: 30px; }
    .bar div { height: 100%; width: 0; background: linear-gradient(90deg, var(--blue), var(--gold)); border-radius: 999px; transition: width .3s; }

    /* Question */
    .question { font-size: 1.45rem; font-weight: 800; color: var(--navy); margin-bottom: 22px; line-height: 1.45; }
    .gap { display: inline-block; min-width: 70px; border-bottom: 3px solid var(--gold); }
    .options { display: grid; gap: 12px; }
    .options button { text-align: left; font-family: inherit; font-size: 1.15rem; font-weight: 700; color: var(--text); background: var(--soft);
                      border: 2px solid #e3d9c8; border-radius: 16px; padding: 16px 20px; cursor: pointer; transition: border-color .15s, background .15s; }
    .options button:hover { border-color: var(--blue); }
    .options button.picked { border-color: var(--blue); background: #e8f2fa; color: var(--navy); }
    .nav-row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .nav-row .btn { margin-top: 26px; }

    /* Result */
    .result-head { text-align: center; }
    .level { display: inline-block; background: var(--navy); color: white; font-size: 2rem; font-weight: 900; padding: 10px 30px; border-radius: 999px; margin: 14px 0 6px; }
    .cefr { display: inline-block; background: var(--gold); color: var(--navy); font-weight: 900; padding: 4px 16px; border-radius: 999px; margin-left: 8px; font-size: 1rem; vertical-align: middle; }
    .score { font-size: 1.25rem; font-weight: 800; color: var(--blue); margin-top: 8px; }
    .advice { background: var(--cream); border-left: 6px solid var(--gold); padding: 16px 20px; border-radius: 12px; margin: 24px 0; }
    .note { font-size: .95rem; color: #7a8394; margin-top: 14px; }

    form { margin-top: 10px; }
    label { display: block; font-weight: 800; margin: 16px 0 8px; color: var(--navy); }
    input { width: 100%; padding: 14px 16px; border: 2px solid #e3d9c8; border-radius: 14px; font-size: 1.05rem; font-family: inherit; font-weight: 600; background: #fffdf9; }
    input:focus { outline: none; border-color: var(--blue); }

    details.review { margin-top: 30px; }
    details.review summary { cursor: pointer; font-weight: 800; color: var(--navy); }
    .rv { padding: 10px 0; border-bottom: 1px solid #efe6d6; font-size: 1rem; }
    .rv .ok { color: var(--green); font-weight: 800; }
    .rv .no { color: var(--red); font-weight: 800; }

    footer { background: var(--navy); color: white; text-align: center; padding: 28px 20px; }
    footer p { opacity: .9; font-size: 1.05rem; font-weight: 700; }

    @media (max-width: 600px) { .panel { padding: 28px 20px; } h1 { font-size: 1.9rem; } .question { font-size: 1.25rem; } .level { font-size: 1.6rem; } }
  </style>
</head>

    // ===== APP =====
    var current = "en", i = 0, answers = [], order = [];
    var $ = function (id) { return document.getElementById(id); };

    function fmt(s, v) { return s.replace(/\{(\w)\}/g, function (_, k) { return v[k]; }); }

    function shuffle(arr) {
      var a = arr.slice();
      for (var k = a.length - 1; k > 0; k--) { var j = Math.floor(Math.random() * (k + 1)); var t = a[k]; a[k] = a[j]; a[j] = t; }
      return a;
    }

    function setLang(l) {
      current = l;
      document.documentElement.lang = l;
      document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = T[l][el.getAttribute("data-i18n")]; });
      document.querySelectorAll(".lang button").forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-lang") === l); });
      try { localStorage.setItem("lang", l); } catch (e) {}
      if (!$("quiz").classList.contains("hidden")) showQ();
      if (!$("result").classList.contains("hidden")) showResult();
    }

    function show(id) {
      ["start", "quiz", "result"].forEach(function (s) { $(s).classList.toggle("hidden", s !== id); });
      window.scrollTo(0, 0);
    }

    function start() {
      i = 0;
      answers = new Array(Q.length);
      order = Q.map(function (q) { return shuffle(q.o); });
      show("quiz");
      showQ();
    }

    function showQ() {
      var t = T[current], q = Q[i];
      $("counter").textContent = fmt(t.of, { n: i + 1, t: Q.length });
      $("fill").style.width = ((i + 1) / Q.length * 100) + "%";
      var parts = q.q.split("___");
      $("qtext").innerHTML = "";
      $("qtext").appendChild(document.createTextNode(parts[0]));
      if (parts.length > 1) {
        var g = document.createElement("span"); g.className = "gap"; g.textContent = answers[i] ? " " + answers[i] + " " : " ";
        $("qtext").appendChild(g);
        $("qtext").appendChild(document.createTextNode(parts[1]));
      }
      var box = $("options"); box.innerHTML = "";
      order[i].forEach(function (opt) {
        var b = document.createElement("button");
        b.type = "button"; b.textContent = opt;
        if (answers[i] === opt) b.className = "picked";
        b.addEventListener("click", function () { answers[i] = opt; showQ(); });
        box.appendChild(b);
      });
      $("prev").style.visibility = i === 0 ? "hidden" : "visible";
      $("next").textContent = i === Q.length - 1 ? t.finish : t.next;
      $("next").disabled = !answers[i];
    }

    function getResult() {
      var s = 0;
      Q.forEach(function (q, k) { if (answers[k] === q.a) s++; });
      var lv = LEVELS.filter(function (l) { return s <= l.max; })[0];
      var course = s <= 15 ? "cGE" : (s <= 20 ? "cBoth" : "cIELTS");
      return { score: s, level: lv, course: course };
    }

    function showResult() {
      var t = T[current], r = getResult();
      $("levelName").textContent = t[r.level.key];
      $("cefr").textContent = r.level.cefr;
      $("scoreLine").textContent = fmt(t.score, { s: r.score, t: Q.length });
      $("levelText").textContent = t[r.level.key + "t"];
      $("course").textContent = t[r.course];

      var list = $("reviewList"); list.innerHTML = "";
      Q.forEach(function (q, k) {
        var ok = answers[k] === q.a;
        var d = document.createElement("div"); d.className = "rv";
        var line1 = document.createElement("div"); line1.textContent = (k + 1) + ". " + q.q;
        var line2 = document.createElement("div");
        var mark = document.createElement("span"); mark.className = ok ? "ok" : "no"; mark.textContent = ok ? "✓ " : "✗ ";
        line2.appendChild(mark);
        line2.appendChild(document.createTextNode(t.yours + ": " + (answers[k] || t.none) + (ok ? "" : "  ·  " + t.correct + ": " + q.a)));
        d.appendChild(line1); d.appendChild(line2); list.appendChild(d);
      });
    }

    $("begin").addEventListener("click", start);
    $("prev").addEventListener("click", function () { if (i > 0) { i--; showQ(); } });
    $("next").addEventListener("click", function () {
      if (!answers[i]) return;
      if (i < Q.length - 1) { i++; showQ(); }
      else { show("result"); showResult(); }
    });
    $("again").addEventListener("click", start);

    // Booking form: opens Telegram with a ready message (same admin as the main site)
    $("bookForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var t = T[current], r = getResult();
      var text = t.msg + "\n" +
        t.lblName + ": " + $("name").value + "\n" +
        t.lblPhone + ": " + $("phone").value + "\n" +
        t.lblResult + ": " + r.score + "/" + Q.length + " — " + t[r.level.key] + " (" + r.level.cefr + ")\n" +
        t.lblCourse + ": " + t[r.course];
      window.open("https://t.me/Motive_Academy_admin?text=" + encodeURIComponent(text), "_blank");
    });

    document.querySelectorAll(".lang button").forEach(function (b) {
      b.addEventListener("click", function () { setLang(b.getAttribute("data-lang")); });
    });

    var saved = "en";
    try { saved = localStorage.getItem("lang") || "en"; } catch (e) {}
    setLang(T[saved] ? saved : "en");
  </script>
</body>
</html>
