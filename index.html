  <style>
    :root { --navy: #0B2545; --blue: #2776AB; --cream: #FFF6E8; --gold: #D4A843; --text: #2A3650; --soft: #FFFDF9; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; scroll-padding-top: 90px; }
    body { font-family: 'Nunito', 'Trebuchet MS', Verdana, sans-serif; font-size: 18px; font-weight: 600; color: var(--text); line-height: 1.75; background: var(--soft); }
    img { max-width: 100%; display: block; }
    a { color: var(--blue); }

    /* NAV */
    nav { position: sticky; top: 0; z-index: 50; background: rgba(255,253,249,.97); box-shadow: 0 2px 14px rgba(11,37,69,.1);
          display: flex; align-items: center; justify-content: space-between; padding: 8px 24px; gap: 12px; flex-wrap: wrap; }
    nav .logo img { height: 56px; width: auto; }
    nav ul { display: flex; gap: 22px; list-style: none; flex-wrap: wrap; }
    nav ul a { text-decoration: none; color: var(--navy); font-weight: 800; font-size: 1.05rem; }
    nav ul a:hover { color: var(--blue); }
    .lang { display: flex; gap: 6px; }
    .lang button { font-family: inherit; border: 2px solid var(--navy); background: transparent; color: var(--navy); padding: 6px 14px; border-radius: 999px; cursor: pointer; font-weight: 800; font-size: .95rem; }
    .lang button.active { background: var(--navy); color: white; }

    /* HERO */
    .hero { color: white; text-align: center; padding: 130px 20px; 
            background: linear-gradient(rgba(11,37,69,.72), rgba(40,30,20,.55)), url("images/reception.jpg") center/cover; }
    .hero h1 { font-size: 3.7rem; font-weight: 900; line-height: 1.15; margin-bottom: 18px; text-shadow: 0 2px 12px rgba(0,0,0,.35); }
    .hero p { font-size: 1.45rem; font-weight: 700; max-width: 700px; margin: 0 auto; }
    .btn { display: inline-block; margin-top: 32px; background: var(--gold); color: var(--navy); padding: 16px 38px; border-radius: 999px; font-family: inherit;
           text-decoration: none; font-weight: 900; border: none; cursor: pointer; font-size: 1.15rem; box-shadow: 0 6px 18px rgba(212,168,67,.45); transition: transform .15s; }
    .btn:hover { transform: translateY(-2px); }
    .btn.blue { background: var(--blue); color: white; box-shadow: 0 6px 18px rgba(39,118,171,.35); }

    /* SECTIONS */
    section { padding: 78px 22px; }
    section.alt { background: var(--cream); }
    .wrap { max-width: 1050px; margin: 0 auto; }
    h2 { color: var(--navy); text-align: center; font-size: 2.7rem; font-weight: 900; line-height: 1.2; margin-bottom: 10px; }
    h2::after { content: ""; display: block; width: 80px; height: 6px; background: var(--gold); margin: 16px auto 40px; border-radius: 999px; }

    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 24px; }
    .card { background: white; border-radius: 24px; padding: 32px; box-shadow: 0 8px 26px rgba(11,37,69,.09); border-top: 6px solid var(--blue);
            display: flex; flex-direction: column; }
    .card.gold { border-top-color: var(--gold); }
    .card h3 { color: var(--navy); font-size: 1.45rem; font-weight: 900; line-height: 1.3; margin-bottom: 10px; }
    .card p { flex: 1; }
    .price { margin-top: 16px; font-weight: 900; color: var(--blue); font-size: 1.7rem; flex: 0 !important; }
    .price small { font-size: .95rem; color: #7a8394; font-weight: 700; }

    .about { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; }
    .about p { font-size: 1.15rem; }
    .about img { border-radius: 24px; box-shadow: 0 10px 30px rgba(11,37,69,.2); }
    .founded { display: inline-block; margin-top: 18px; background: var(--cream); border-left: 6px solid var(--gold); padding: 12px 20px; border-radius: 12px; font-weight: 800; color: var(--navy); }
    @media (max-width: 720px) { .about { grid-template-columns: 1fr; } .hero h1 { font-size: 2.5rem; } h2 { font-size: 2.1rem; } .hero { padding: 90px 20px; } }

    .teachers { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 32px; max-width: 760px; margin: 0 auto; }
    .teacher { background: white; border-radius: 24px; overflow: hidden; box-shadow: 0 8px 26px rgba(11,37,69,.1); text-align: center; }
    .teacher img { width: 100%; aspect-ratio: 3/4; object-fit: cover; object-position: top; }
    .teacher .info { padding: 24px; }
    .teacher h3 { color: var(--navy); font-size: 1.55rem; font-weight: 900; }
    .teacher .role { color: var(--blue); font-weight: 800; font-size: 1.05rem; margin-bottom: 8px; }

    .results { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 30px; }
    .result { background: white; border-radius: 24px; overflow: hidden; box-shadow: 0 8px 26px rgba(11,37,69,.1); }
    .result img { width: 100%; height: 440px; object-fit: cover; object-position: top; }
    .result .info { padding: 24px; }
    .result h3 { color: var(--navy); font-size: 1.4rem; font-weight: 900; margin-bottom: 6px; }
    .badge { display: inline-block; background: var(--gold); color: var(--navy); font-weight: 900; padding: 4px 16px; border-radius: 999px; margin-bottom: 10px; }

    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .gallery img { width: 100%; height: 210px; object-fit: cover; border-radius: 18px; cursor: zoom-in; transition: transform .2s; box-shadow: 0 4px 14px rgba(11,37,69,.12); }
    .gallery img:hover { transform: scale(1.03); }
    #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.88); z-index: 100; align-items: center; justify-content: center; padding: 20px; cursor: zoom-out; }
    #lightbox.open { display: flex; }
    #lightbox img { max-height: 92vh; max-width: 96vw; border-radius: 12px; }

    details { background: white; border-radius: 18px; padding: 20px 26px; margin-bottom: 14px; box-shadow: 0 4px 14px rgba(11,37,69,.08); }
    summary { cursor: pointer; font-weight: 800; font-size: 1.15rem; color: var(--navy); }
    details p { margin-top: 12px; }

    form { background: white; max-width: 560px; margin: 0 auto; padding: 34px; border-radius: 24px; box-shadow: 0 8px 28px rgba(11,37,69,.12); }
    label { display: block; font-weight: 800; margin: 16px 0 8px; color: var(--navy); }
    input, select { width: 100%; padding: 14px 16px; border: 2px solid #e3d9c8; border-radius: 14px; font-size: 1.05rem; font-family: inherit; font-weight: 600; background: #fffdf9; }
    input:focus, select:focus { outline: none; border-color: var(--blue); }
    form .btn { width: 100%; margin-top: 26px; }
    .note { font-size: .95rem; color: #7a8394; margin-top: 14px; text-align: center; }

    .find { display: grid; grid-template-columns: 1fr 1.1fr; gap: 36px; align-items: center; }
    .find img { border-radius: 24px; box-shadow: 0 10px 30px rgba(11,37,69,.2); width: 100%; max-height: 520px; object-fit: cover; }
    .find p { font-size: 1.2rem; margin: 10px 0; }
    .find a:not(.btn) { font-weight: 800; text-decoration: none; }
    .find .label { display: block; font-size: .9rem; font-weight: 800; color: #8a7a5a; text-transform: uppercase; letter-spacing: .06em; }
    @media (max-width: 720px) { .find { grid-template-columns: 1fr; } }
    .map { margin-top: 32px; border: 0; border-radius: 24px; width: 100%; height: 360px; box-shadow: 0 8px 26px rgba(11,37,69,.15); }

    footer { background: var(--navy); color: white; text-align: center; padding: 34px 20px; }
    footer p { opacity: .9; font-size: 1.05rem; font-weight: 700; }

    var current = "en";

    function setLang(l) {
      current = l;
      document.documentElement.lang = l;
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        el.textContent = T[l][el.getAttribute("data-i18n")];
      });
      document.querySelectorAll(".lang button").forEach(function (b) {
        b.classList.toggle("active", b.getAttribute("data-lang") === l);
      });
      try { localStorage.setItem("lang", l); } catch (e) {}
    }

    document.querySelectorAll(".lang button").forEach(function (b) {
      b.addEventListener("click", function () { setLang(b.getAttribute("data-lang")); });
    });

    // Sign-up form: opens Telegram with a ready message to the administrator
    document.getElementById("signupForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var t = T[current];
      var text = t.msg + "\n" +
        t.lblName + ": " + document.getElementById("name").value + "\n" +
        t.lblPhone + ": " + document.getElementById("phone").value + "\n" +
        t.lblCourse + ": " + document.getElementById("course").value;
      window.open("https://t.me/Motive_Academy_admin?text=" + encodeURIComponent(text), "_blank");
    });

    // Gallery: click a photo to enlarge, click again to close
    var box = document.getElementById("lightbox");
    document.querySelectorAll(".gallery img").forEach(function (img) {
      img.addEventListener("click", function () {
        box.querySelector("img").src = img.src;
        box.classList.add("open");
      });
    });
    box.addEventListener("click", function () { box.classList.remove("open"); });

    var saved = "en";
    try { saved = localStorage.getItem("lang") || "en"; } catch (e) {}
    setLang(T[saved] ? saved : "en");
  </script>
